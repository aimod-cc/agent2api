name: backfill-gitee-v271

# 临时工作流：v2.7.1 发版早于 gitee-release job 上线，把 GitHub Release
# 上的两个安装包搬一份到 Gitee 的 v2.7.1 发行版。搬完删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 GitHub Release 产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.1 -R aimod-cc/agent2api -D dist
          ls -lh dist

      - name: 发布到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v2.7.1"
          API="https://gitee.com/api/v5/repos/aimodcc/agent2api"
          AUTH="Authorization: Bearer ${GITEE_TOKEN}"
          # 正文沿用 GitHub Release 的正文（同一份提交信息）
          NOTES=$(gh release view "$TAG" -R aimod-cc/agent2api --json body -q .body)

          # 幂等：已存在则先删再建（与 build.yml 的 gitee-release 同一套坑位处理）
          REL_JSON=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" || true)
          OLD_ID=$(echo "$REL_JSON" | jq -r 'if type == "array" then (.[0].id // empty) elif type == "object" then (.id // empty) else empty end')
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "null" ]; then
            echo "已存在发行版 id=$OLD_ID，先删除"
            curl -sf -X DELETE -H "$AUTH" "$API/releases/$OLD_ID"
          fi

          jq -n --arg tag "$TAG" --arg body "$NOTES" \
            '{tag_name:$tag, name:$tag, target_commitish:"main", body:$body}' > /tmp/release.json
          RELEASE_ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d @/tmp/release.json "$API/releases" | jq -r '.id')
          echo "Gitee 发行版已创建 id=$RELEASE_ID"

          for f in dist/*; do
            echo "上传 $(basename "$f")"
            curl -sf -X POST -H "$AUTH" -F "file=@$f" \
              "$API/releases/$RELEASE_ID/attach_files" > /dev/null
          done

          # 回读校验：附件数量应为 2
          COUNT=$(curl -sf -H "$AUTH" "$API/releases/$RELEASE_ID/attach_files" | jq 'length')
          echo "附件数: $COUNT"
          [ "$COUNT" = "2" ] || { echo "附件数量异常"; exit 1; }
          echo "v2.7.1 已补发到 Gitee"
