name: test-gitee-release

# 临时工作流：验证 Gitee Release API 全链路（建发行版 → 传附件 → 删除），
# 验证通过后本文件会被删除，正式逻辑在 build.yml 的 gitee-release job。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Gitee Release API 连通性测试
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          TAG="v2.7.1"
          API="https://gitee.com/api/v5/repos/aimodcc/agent2api"
          AUTH="Authorization: Bearer ${GITEE_TOKEN}"

          # 已存在同名发行版则先删（幂等）。注意：无发行版时该接口也返回
          # 200，body 是空数组 —— 必须解析出真实 id 再删
          REL_JSON=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" || true)
          OLD_ID=$(echo "$REL_JSON" | jq -r 'if type == "array" then (.[0].id // empty) elif type == "object" then (.id // empty) else empty end')
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "null" ]; then
            echo "已存在发行版 id=$OLD_ID，先删除"
            curl -sf -X DELETE -H "$AUTH" "$API/releases/$OLD_ID"
          fi

          # 建发行版（打印原始响应便于排障）。target_commitish 实测必传，
          # 文档写可选不可信
          jq -n --arg tag "$TAG" '{tag_name:$tag, name:$tag, target_commitish:"main", body:"CI API 连通性测试，稍后自动删除"}' > /tmp/rel.json
          HTTP_CODE=$(curl -s -o /tmp/create-resp.json -w "%{http_code}" -X POST -H "$AUTH" \
            -H "Content-Type: application/json" -d @/tmp/rel.json "$API/releases")
          echo "建发行版: HTTP $HTTP_CODE"
          cat /tmp/create-resp.json
          echo
          RELEASE_ID=$(jq -r '.id // empty' /tmp/create-resp.json)
          echo "建发行版成功 id=$RELEASE_ID"

          # 传附件
          echo "test attachment" > /tmp/attach-test.txt
          curl -sf -X POST -H "$AUTH" -F "file=@/tmp/attach-test.txt" \
            "$API/releases/$RELEASE_ID/attach_files" | jq '{name, size}'
          echo "传附件成功"

          # 删除发行版（连附件一起清掉）
          curl -sf -X DELETE -H "$AUTH" "$API/releases/$RELEASE_ID"
          echo "测试发行版已删除，全链路 OK"
