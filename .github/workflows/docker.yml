name: docker

# 构建网关镜像（amd64 + arm64）并推送到 Docker Hub。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推送 v* tag（如 v2.7.1）：产出 aimodcc/agent2api:<版本号> 与 :latest
#   · 手动 workflow_dispatch：产出 :dev（移动测试 tag，不碰正式 tag）
#   推 v* tag 时与 build.yml 同时触发 —— 一次打 tag，安装包与镜像一起出来
#
# ── 为什么 runner 上不用装 QEMU ───────────────────────────────
# Dockerfile 的 builder 固定跑在 $BUILDPLATFORM：runner 是 amd64，arm64
# 走 aarch64 工具链交叉编译。本地与 CI 同一套交叉编译路径，无需
# setup-qemu-action，也没有 QEMU 模拟下 Rust 编译慢几十倍的问题。
#
# ── 缓存 ─────────────────────────────────────────────────────
# type=gha 把 BuildKit 缓存挂到 Actions cache：Dockerfile 的「桩依赖层」
# 首次编完整棵依赖树后落缓存，之后每次构建直接命中，只剩源码层重编。
#
# ── action 版本 ──────────────────────────────────────────────
# 与 build.yml 同一标准：直接钉最新大版本。截至本次编写：
# setup-buildx v4 / login v4 / metadata v6 / build-push v7，
# login v4 起已默认 Node 24 运行时，无 Node 20 弃用问题。
#
# ── GHCR 双推（可选，暂未启用）────────────────────────────────
# 想多推一份 ghcr.io/aimod-cc/agent2api 时：
#   1. 顶层 permissions 加 packages: write
#   2. login-action 再加一段 ghcr.io（username: ${{ github.actor }}，
#      password: ${{ github.token }}，无需额外 secret）
#   3. metadata-action 的 images 多列一行即可
#   注意：GHCR 新包默认私有，首次推送后需到包设置手动改 Public。
#
# ── secrets ──────────────────────────────────────────────────
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Read & Write 权限的 Access Token）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: aimodcc/agent2api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag 推送：v2.7.1 → 2.7.1 + latest；手动触发：只出 dev
      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
